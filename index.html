<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICC Formation 2026 — QR Check-In</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Arial,sans-serif;background:#f5f3f6;color:#24202a;margin:0;padding:16px}main{max-width:480px;margin:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px #0001}h1{color:#60243d;font-size:24px;margin:0 0 5px}.sub{color:#666;margin-bottom:18px}label{display:block;font-weight:600;margin-top:14px}input,button{width:100%;font-size:16px;padding:13px;border-radius:9px;margin:6px 0}input{border:1px solid #bbb}button{background:#60243d;color:#fff;border:0;font-weight:600}button.secondary{background:#37445a}button:disabled{opacity:.5}#reader{width:100%;margin:12px auto;overflow:hidden}#result{padding:14px;border-radius:10px;margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f0eef0}#result.ok{background:#e2f4e8;color:#18552c}#result.bad{background:#ffe3e3;color:#862222}small{display:block;color:#777;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>ICC Formation 2026</h1><div class="sub">Participant QR Attendance Check-In</div>
<label for="scanner">Volunteer / Registration Desk</label><input id="scanner" placeholder="e.g., Desk 1 - Maria" maxlength="80">
<button id="start" type="button">Start Camera Scanner</button><button id="stop" class="secondary" type="button" disabled>Stop Camera</button>
<div id="reader"></div>
<label for="manual">Manual Registration ID</label><input id="manual" placeholder="ICC26-00001" autocapitalize="characters" autocomplete="off" spellcheck="false">
<button id="submit" type="button">Check In ID</button>
<div id="result" role="status" aria-live="polite">Ready to scan.</div>
<small>For registration volunteers. A check-in opens the result in this tab. Tap “Back to Scanner” to continue.</small>
</main>
<form id="checkinForm" method="POST" action="https://script.google.com/macros/s/AKfycbzqKzKaVYE-4eRYYRkWeT-MsObHidVp_CgpJlYRvIkfoJlS2yIAACmu9x2dC9JOqWsO/exec" accept-charset="UTF-8" style="display:none">
<input name="registrationId" id="formId"><input name="scannerName" id="formScanner">
</form>
<script>
const el=id=>document.getElementById(id);
let qr=null,scanning=false,starting=false,submitting=false;
function show(message,cls=''){el('result').className=cls;el('result').textContent=message;}
function submitId(raw){
 if(submitting)return;
 const match=String(raw||'').toUpperCase().match(/ICC26-\d{5,}/);
 if(!match){show('QR code does not contain a valid ICC26 registration ID.','bad');return;}
 submitting=true;el('submit').disabled=true;el('start').disabled=true;
 show('Opening check-in result for '+match[0]+'…');
 el('formId').value=match[0];el('formScanner').value=el('scanner').value.trim()||'Mobile volunteer';
 sessionStorage.setItem('iccScannerName',el('formScanner').value);
 // Native top-level form navigation avoids the Apps Script X-Frame-Options iframe block.
 el('checkinForm').submit();
}
async function startScan(){
 if(starting||scanning||submitting)return;
 starting=true;el('start').disabled=true;show('Requesting camera access…');
 try{
  if(typeof Html5Qrcode==='undefined')throw Error('Scanner library failed to load.');
  if(!window.isSecureContext)throw Error('Open the HTTPS GitHub Pages link in Safari or Chrome.');
  qr=new Html5Qrcode('reader',{verbose:false});
  const config={fps:10,qrbox:{width:220,height:220}};
  try{await qr.start({facingMode:'environment'},config,submitId,()=>{});}
  catch(first){try{qr.clear();}catch(_){}qr=new Html5Qrcode('reader',{verbose:false});const cams=await Html5Qrcode.getCameras();if(!cams.length)throw first;const rear=cams.find(c=>/back|rear|environment/i.test(c.label))||cams[cams.length-1];await qr.start(rear.id,config,submitId,()=>{});}
  scanning=true;el('stop').disabled=false;show('Camera ready. Point at a participant QR code.','ok');
 }catch(err){show('Camera unavailable: '+(err.message||String(err))+'\nUse manual ID entry.','bad');if(qr){try{qr.clear();}catch(_){}}qr=null;}
 finally{starting=false;el('start').disabled=scanning||submitting;}
}
async function stopScan(){if(!qr||!scanning)return;el('stop').disabled=true;try{await qr.stop();qr.clear();show('Camera stopped.');}catch(err){show('Camera stop error: '+err,'bad');}finally{qr=null;scanning=false;el('start').disabled=false;}}
el('start').addEventListener('click',startScan);el('stop').addEventListener('click',stopScan);el('submit').addEventListener('click',()=>submitId(el('manual').value));el('manual').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitId(el('manual').value);}});
el('scanner').value=sessionStorage.getItem('iccScannerName')||'';
</script>
</body></html>
